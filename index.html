<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Alessa Weiler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- UI Overlay -->
    <div class="game-ui">
        <div class="header-overlay">
            <div class="logo">
                <h1>Alessa's Journey</h1>
            </div>
            <nav>
                <a href="/about.html">About</a>
            </nav>
        </div>

        <div class="intro-overlay">
            <h2>Hello World!</h2>
            <p>Hi, I'm Alessa. Welcome to my interactive portfolio! Walk through my journey and click on buildings to explore my projects.</p>
            <div class="social-icons">
                <a href="https://github.com/alessa-weiler" target="_blank">GitHub</a>
                <a href="https://linkedin.com/in/alessaweiler" target="_blank">LinkedIn</a>
                <a href="mailto:alessa@pont-diagnostics.com">Email</a>
                <a href="https://alessaweiler.medium.com/" target="_blank">Blog</a>
            </div>
        </div>

        <div id="instructions">
            <p>Use <strong>W A S D</strong> to move | <strong>Mouse Wheel</strong> to zoom | <strong>Shift</strong> to run | <strong>Click</strong> buildings to interact</p>
        </div>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div id="info-panel">
            <button id="close-btn">&times;</button>
            <h3 id="experience-title"></h3>
            <p id="experience-year"></p>
            <p id="experience-description"></p>
        </div>

        <div id="labels-container"></div>
    </div>

    <script type="module" src="/game.js"></script>
</body>
</html>
